# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
#
# Builds the XQAA Sphinx site (rooted at docs/source/) on every push.
# The package is NOT pip-installed here: its `ocpy` dependency is git-only,
# so conf.py adds the repo root to sys.path and mocks ocpy for autodoc.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"          # XQAA requires Python >= 3.10

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false    # advisory

python:
  install:
    # Documentation build dependencies (Sphinx + theme + the sci stack
    # needed to import xqaa from source; ocpy is mocked in conf.py).
    - requirements: docs/requirements.txt
