name: CI Tests

on:
  push:
    branches:
    - main
    tags:
  pull_request:

env:
  SETUP_XVFB: True  # avoid issues if mpl tries to open a GUI window

jobs:
  ci-tests:
    name: Python-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    if: "!(contains(github.event.head_commit.message, '[skip ci]') || contains(github.event.head_commit.message, '[ci skip]'))"

    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.12']

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install xqaa and test dependencies
      # ocpy is a private git dependency; it is NOT installed in CI and the
      # ocpy-dependent test skips itself when ocpy is absent.
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy scipy pandas matplotlib pytest
        python -m pip install -e . --no-deps
    - name: Print Python, pip, and numpy versions
      run: |
        python -c "import sys; print(f'Python {sys.version}')"
        python -c "import pip; print(f'pip {pip.__version__}')"
        python -c "import numpy; print(f'numpy {numpy.__version__}')"
    - name: Run tests
      run: pytest

  codestyle:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
    - uses: actions/checkout@v4
    - name: Python codestyle check
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pycodestyle
    - name: Check for runtime errors using pycodestyle
      run: |
        pycodestyle xqaa --count --select=E9
