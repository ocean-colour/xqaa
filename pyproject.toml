# pyproject.toml -- build configuration for the xqaa package

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xqaa"
version = "0.1.dev0"
description = "XQAA: an improved Quasi-Analytical Algorithm for ocean-color IOP retrieval"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "J. Xavier Prochaska", email = "jxp@ucsc.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    # ocpy is not on PyPI; installed as a direct git reference
    "ocpy @ git+https://github.com/ocean-colour/ocpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ocean-colour/xqaa"

[tool.setuptools.packages.find]
include = ["xqaa*"]

[tool.setuptools.package-data]
# Ship the bundled data tables and test fixture files
xqaa = ["data/*.npz", "tests/files/*.csv"]
